version: "3.9"

services:
  backend:
    build:
      context: ./yetosoll-server
      dockerfile: Dockerfile
    ports:
      - "3051:5000"
    env_file: .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./yetosoll-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3050:3000"
    env_file: .env.production
